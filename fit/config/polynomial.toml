# d2l 4.4.4: 只保留模型阶数与主要训练超参数。
# i 为最高次数，特征数为 i+1; 教材三组对应 i=1、3、19。
i = 3
batch_size = 10
learning_rate = 0.01
epochs = 100

# 训练集/测试集各 100 个样本，噪声标准差 0.1，种子 42，使用 CPU。
# 首次训练前运行 python data/code/generate_polynomial.py 生成数据。
# 数据保存在 data/polynomial/dataset.pt，后续训练直接读取。
# python fit/code/train.py --i 1
# python fit/code/train.py --i 3 --logger tensorboard
# python fit/code/train.py --i 19 --epochs 1500 --logger both

# 正则化与特征 Dropout 默认关闭; strength 与 probability 仅在对应开关开启时生效。
regularization = false
regularization_strength = 0.001
dropout = false
dropout_probability = 0.1
# 从已生成的训练集中取前 N 个样本，测试集不变。
train_samples = 100

# python fit/code/train.py --i 4 --train-samples 8 --lr 0.5 --epochs 20000 --regularization --regularization-strength 0.001
# python fit/code/train.py --i 4 --train-samples 8 --lr 0.5 --epochs 20000 --dropout --dropout-probability 0.01
# python fit/code/train.py --i 4 --train-samples 8 --lr 0.5 --epochs 20000 --regularization --regularization-strength 0.001 --dropout --dropout-probability 0.01
